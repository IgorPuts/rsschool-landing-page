<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu-catalog</title>
  <link rel="icon" type="image/svg+xml" href="./assets/svg/coffee-favicon.svg">
</head>
<body>
  <header class="header">
    <div class="wrapper">
      <div class="header__menu">
        <div class="header__logo"></div>
        <nav class="nav">
          <ul class="nav-list">
            <li class="nav-item"><a href="gifts.html" class="nav-link">Favorite coffee</a></li>
            <li class="nav-item"><a href="#about" class="nav-link">About</a></li>
            <li class="nav-item"><a href="#best" class="nav-link">Mobile app</a></li>
            <li class="nav-item"><a href="#contacts" class="nav-link">Contact us</a></li>
          </ul>
        </nav>
        <div class="header__actions">
          <div class="theme-switch"></div>
          <div class="burger-menu"></div>
        </div>
      </div>
    </div>
  </header>
  <main>
    <div class="wrapper">
      <div class="menu">
        <div class="offer">
          <h2>Behind each of our cups hides an <span class="all-layuots-text">amazing surprise</span></h2>
          <div class="tabs">
            <button type="button" class="tab tab-coffee">
              <img src="assets/icon.png" alt="" width="16" height="16">
              <span>Coffee</span>
            </button>
            <button type="button" class="tab tab-tea">
              <img src="assets/icon.png" alt="" width="16" height="16">
              <span>Tea</span>
            </button>
            <button type="button" class="tab tab-dessert">
              <img src="assets/icon.png" alt="" width="16" height="16">
              <span>Dessert</span>
            </button>
          </div>
        </div>
        <div class="menu-carts__preview">
            <div class="cart__preview">
              <div class="cart__img"></div>
              <div class="cart__title">
                <h3>Irish coffee</h3>
                <p>Fragrant black coffee with Jameson Irish whiskey and whipped milk</p>
                <p class="cart__price">$7.00</p>
              </div>
            </div>
        </div>
      </div>

    </div>

  </main>

  <footer class="footer">
  <div class="wrapper">
    <div class="footer-container">
      <div class="footer__offer">
        <h2><span class="for-dark-layouts-text">Sip, Savor, Smile.</span><br><span class="all-layuots-text">It’s coffee time!</span></h2>
        <div class="socials"></div>
      </div>
      <div class="contact-us">
        <h3>Contact us</h3>
        <div class="links">
          <a></a>
          <a></a>
          <a></a>
        </div>
      </div>
    </div>

  </div>
</footer>
<script src="./js/index.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
