<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu-catalog</title>
  <link rel="icon" type="image/svg+xml" href="./assets/svg/coffee-favicon.svg">
    <link rel="stylesheet" href="./css/fonts.css">
  <link rel="stylesheet" href="./css/normalize.css">
  <link rel="stylesheet" href="./css/settings.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layouts.css">
</head>
<body>

<header class="header" id="header-placeholder"></header>

  <main>
    <div class="wrapper">
      <div class="menu">
        <div class="offer">
          <h2>Behind each of our cups hides an <span class="all-layuots-text">amazing surprise</span></h2>
          <div class="tabs">
            <button type="button" class="tab tab-coffee">
              <img src="assets/icon.png" alt="" width="16" height="16">
              <span>Coffee</span>
            </button>
            <button type="button" class="tab tab-tea">
              <img src="assets/icon.png" alt="" width="16" height="16">
              <span>Tea</span>
            </button>
            <button type="button" class="tab tab-dessert">
              <img src="assets/icon.png" alt="" width="16" height="16">
              <span>Dessert</span>
            </button>
          </div>
        </div>
        <div class="menu-carts__preview">
            <div class="cart__preview">
              <div class="cart__img"></div>
              <div class="cart__title">
                <h3>Irish coffee</h3>
                <p>Fragrant black coffee with Jameson Irish whiskey and whipped milk</p>
                <p class="cart__price">$7.00</p>
              </div>
            </div>
        </div>
      </div>
    </div>
  </main>

<footer class="footer" id="footer-placeholder"></footer>

<script src="./js/coffee-site-parts.js"></script>
<script src="./js/index.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
